server:
  port: ${PORT:8080}

spring:
  application:
    name: waslah-agent
  datasource:
    # The app connects as a NON-superuser role so Postgres row-level security is enforced.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waslah}
    username: ${DB_APP_USER:waslah_app}
    password: ${DB_APP_PASSWORD:waslah_app}
  flyway:
    # Migrations run as the schema owner.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waslah}
    user: ${DB_OWNER_USER:waslah}
    password: ${DB_OWNER_PASSWORD:waslah}
    # Used by db/migration/beforeMigrate.sql to create the runtime role on a fresh managed database (Cloud SQL).
    placeholders:
      app_password: ${DB_APP_PASSWORD:waslah_app}
  jackson:
    default-property-inclusion: non_null
  # Outgoing email (support form forwarding). Blank MAIL_HOST = messages are kept in the database only.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
  servlet:
    multipart:
      # Spreadsheets up to 5 MB, listing photos up to 5 MB each.
      max-file-size: 6MB
      max-request-size: 8MB

management:
  endpoints:
    web:
      exposure:
        # In production MANAGEMENT_SERVER_PORT=8081 keeps these off the public port.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # An unreachable mail server must not mark the API unhealthy.
    mail:
      enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # Customer chats are personal data (PDPL): never attach request bodies or user details to error reports.
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

waslah:
  jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-at-least-32-bytes}
  # Base64 of a 32-byte key used to encrypt WhatsApp access tokens at rest (AES-256-GCM).
  token-key: ${TOKEN_ENC_KEY:ZGV2LW9ubHkta2V5LWNoYW5nZS1tZS0zMi1ieXRlcyE=}
  cookie-secure: ${COOKIE_SECURE:false}
  dev-tools-enabled: ${DEV_TOOLS:false}
  whatsapp:
    # mock = no calls to Meta (local dev and tests); cloud = real WhatsApp Cloud API.
    mode: ${WA_MODE:mock}
    graph-version: ${WA_GRAPH_VERSION:v23.0}
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:dev-app-secret}
    verify-token: ${WA_VERIFY_TOKEN:dev-verify-token}
    config-id: ${META_CONFIG_ID:}
    registration-pin: ${WA_REGISTRATION_PIN:}
  agent:
    enabled: ${AGENT_ENABLED:true}
    # After a marketer replies from the WhatsApp app, or after a handoff, the agent stays silent in that chat for this long.
    human-pause-hours: ${AGENT_HUMAN_PAUSE_HOURS:12}
    # Customers often send several short messages in a row; wait this long and answer them together.
    debounce-ms: ${AGENT_DEBOUNCE_MS:3000}
    history-limit: ${AGENT_HISTORY_LIMIT:20}
    # Approved WhatsApp template used to alert a marketer about a handoff (sent to the marketer's own number).
    # Leave blank until the template is approved; handoffs still show in the portal.
    handoff-template: ${AGENT_HANDOFF_TEMPLATE:}
    handoff-template-language: ${AGENT_HANDOFF_TEMPLATE_LANG:ar}
    # Abuse protection: agent replies per customer per day before the chat goes to the office.
    daily-reply-cap: ${AGENT_DAILY_REPLY_CAP:50}
    # Approved templates for messages sent outside the 24-hour window (viewing reminder, post-visit follow-up).
    reminder-template: ${AGENT_REMINDER_TEMPLATE:}
    follow-up-template: ${AGENT_FOLLOWUP_TEMPLATE:}
  llm:
    # gemini = real model (needs GEMINI_API_KEY); scripted = offline stand-in for dev and tests.
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    model: ${LLM_MODEL:gemini-3.5-flash-lite}
    # Leave blank if the model rejects thinkingConfig.
    thinking-level: ${LLM_THINKING_LEVEL:low}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:1024}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
  billing:
    # mock = portal "pays" with one click (only when DEV_TOOLS=true); moyasar = real hosted invoices.
    provider: ${BILLING_PROVIDER:mock}
    moyasar-secret-key: ${MOYASAR_SECRET_KEY:}
    portal-base-url: ${PORTAL_BASE_URL:http://localhost:3000}
    # Public URL of this API for Moyasar's payment notification (blank = rely on the customer returning to the portal).
    api-base-url: ${API_BASE_URL:}
    vat-percent: ${VAT_PERCENT:15}
    grace-days: ${BILLING_GRACE_DAYS:7}
  report:
    # Approved WhatsApp template for the daily manager report (feature 8), sent from the office's own number
    # to the owner's phone. Blank = the report is kept in the portal only.
    template: ${REPORT_TEMPLATE:}
    template-language: ${REPORT_TEMPLATE_LANG:ar}
  # Platform operator console (/admin/*): reviews FAL licenses across offices. Blank disables it.
  admin-token: ${ADMIN_TOKEN:}
  privacy:
    # PDPL data minimisation: chat content older than this is deleted (conversation counts are kept).
    message-retention-days: ${MESSAGE_RETENTION_DAYS:730}
    # Raw WhatsApp webhook payloads are only needed for debugging.
    webhook-retention-days: ${WEBHOOK_RETENTION_DAYS:30}
  support:
    # Support form messages are forwarded here (Reply-To is the sender, so you can answer directly).
    forward-to: ${SUPPORT_FORWARD_TO:faisal@hidaaco.com}
    from: ${SUPPORT_FROM:no-reply@hidaaco.com}
  jobs:
    # internal = timers inside the app (single server); external = Cloud Scheduler calls /internal/jobs/* (Cloud Run).
    scheduler: ${JOBS_SCHEDULER:internal}
    token: ${JOBS_TOKEN:}
