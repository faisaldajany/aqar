services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: waslah
      POSTGRES_USER: waslah
      POSTGRES_PASSWORD: waslah
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waslah -d waslah"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
