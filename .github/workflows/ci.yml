name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests plus Testcontainers integration tests against Postgres 16 (Docker is available on ubuntu runners).
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee mvn.log
      # Surfaces compile errors and test failures as annotations, readable without downloading logs.
      - name: Report failures
        if: failure()
        run: |
          {
            grep -E '^\[ERROR\] .*\.java:\[[0-9]+' mvn.log || true
            grep -E '<<< (FAILURE|ERROR)!' mvn.log || true
            grep -hE -A3 '<<< (FAILURE|ERROR)!' target/surefire-reports/*.txt 2>/dev/null | grep -vE '^\s*at |^--$' || true
            grep -E '^\[ERROR\] (Failed to execute|Tests run:|  [A-Za-z]+Test)' mvn.log || true
            grep -E 'Caused by:' mvn.log | sort | uniq -c | sort -rn | head -5 || true
          } | awk '!seen[$0]++' | cut -c1-900 > report.txt
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            if [ $n -le 10 ]; then echo "::error::$line"
            elif [ $n -le 20 ]; then echo "::warning::$line"
            elif [ $n -le 30 ]; then echo "::notice::$line"
            fi
          done < report.txt

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
